<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamyfei - Tafuta Filamu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* ============ HATUA 1: Styling ya Search Section ============ */
        .search-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .search-section h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 28px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #movieInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #movieInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        /* ============ HATUA 2: Styling ya Results ============ */
        #movieResults {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            min-height: 200px;
        }

        .movie-card {
            background: #f5f5f5;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }

        .movie-poster {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #ddd;
        }

        .movie-info {
            padding: 10px;
            text-align: center;
        }

        .movie-title {
            font-weight: bold;
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .movie-year {
            color: #666;
            font-size: 12px;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
            padding: 30px;
        }

        /* ============ HATUA 3: Styling ya Chatbot Section ============ */
        .chatbot-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: fit-content;
        }

        .chatbot-section h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }

        #chatBox {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .chat-message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            word-wrap: break-word;
            max-width: 90%;
        }

        .user-message {
            background: #667eea;
            color: white;
            text-align: right;
            margin-left: auto;
            margin-right: 0;
        }

        .bot-message {
            background: #e0e0e0;
            color: #333;
            text-align: left;
            margin-right: auto;
            margin-left: 0;
        }

        .chat-input-box {
            display: flex;
            gap: 10px;
        }

        #chatInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        #chatInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: translateY(-2px);
        }

        /* ============ HATUA 4: Responsive Design ============ */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            #movieResults {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .search-section h1 {
                font-size: 24px;
            }

            .chatbot-section h2 {
                font-size: 20px;
            }

            .chat-message {
                max-width: 95%;
            }
        }

        /* ============ HATUA 5: Error Messages ============ */
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ============ HATUA 6: Search Section ============ -->
        <div class="search-section">
            <h1>🎬 Hamyfei Filamu</h1>
            <div class="search-box">
                <input 
                    type="text" 
                    id="movieInput" 
                    placeholder="Andika jina la filamu... (e.g., Avatar, Inception)"
                    onkeypress="handleEnter(event)"
                >
                <button class="search-btn" onclick="searchMovies()">Tafuta</button>
            </div>
            <div id="movieResults" class="no-results">
                Jaribu kutafuta filamu yoyote!
            </div>
        </div>

        <!-- ============ HATUA 7: Chatbot Section ============ -->
        <div class="chatbot-section">
            <h2>💬 Movie Bot</h2>
            <div id="chatBox"></div>
            <div class="chat-input-box">
                <input 
                    type="text" 
                    id="chatInput" 
                    placeholder="Andika ujumbe wa Kiswahili..."
                    onkeypress="handleChatEnter(event)"
                >
                <button class="send-btn" onclick="sendMessage()">Tuma</button>
            </div>
        </div>
    </div>

    <!-- ============ HATUA 8: JavaScript Code ============ -->
    <script>
        // ============ HATUA 8a: Njia ya kutafuta filamu ============
        function searchMovies() {
            const movieInput = document.getElementById('movieInput');
            const movieName = movieInput.value.trim();

            if (!movieName) {
                showError('Tafadhali andika jina la filamu!');
                return;
            }

            // Onesha loading message
            const movieResults = document.getElementById('movieResults');
            movieResults.innerHTML = '<div class="loading">⏳ Inatafuta filamu...</div>';

            // Tuma request kwa Flask API
            fetch('/api/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ movie: movieName })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.movies.length > 0) {
                    displayMovies(data.movies);
                } else {
                    movieResults.innerHTML = '<div class="no-results">' + (data.message || 'Hakuna matokeo') + '</div>';
                }
            })
            .catch(error => {
                console.error('Hitilafu:', error);
                showError('Hitilafu katika kutafuta filamu: ' + error);
            });
        }

        // ============ HATUA 8b: Onesha filamu katika grid ============
        function displayMovies(movies) {
            const movieResults = document.getElementById('movieResults');
            movieResults.innerHTML = '';

            movies.forEach(movie => {
                const movieCard = document.createElement('div');
                movieCard.className = 'movie-card';
                movieCard.innerHTML = `
                    <img 
                        src="${movie.Poster !== 'N/A' ? movie.Poster : 'https://via.placeholder.com/150x200?text=No+Image'}" 
                        alt="${movie.Title}" 
                        class="movie-poster"
                    >
                    <div class="movie-info">
                        <div class="movie-title">${movie.Title}</div>
                        <div class="movie-year">${movie.Year}</div>
                    </div>
                `;
                movieResults.appendChild(movieCard);
            });
        }

        // ============ HATUA 8c: Njia ya chatbot - Tuma ujumbe ============
        function sendMessage() {
            const chatInput = document.getElementById('chatInput');
            const userMessage = chatInput.value.trim();

            if (!userMessage) {
                return;
            }

            // Onesha ujumbe wa mtumiaji
            addMessageToChat(userMessage, 'user');
            chatInput.value = '';

            // Tuma request kwa Flask API
            fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: userMessage })
            })
            .then(response => response.json())
            .then(data => {
                // Onesha jibu la bot
                addMessageToChat(data.response, 'bot');
            })
            .catch(error => {
                console.error('Hitilafu:', error);
                addMessageToChat('Hitilafu: ' + error, 'bot');
            });
        }

        // ============ HATUA 8d: Ongeza ujumbe katika chat box ============
        function addMessageToChat(message, sender) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message ' + (sender === 'user' ? 'user-message' : 'bot-message');
            messageDiv.textContent = message;
            chatBox.appendChild(messageDiv);
            
            // Scroll kwa chini
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ============ HATUA 8e: Keyboard shortcuts ============
        function handleEnter(event) {
            if (event.key === 'Enter') {
                searchMovies();
            }
        }

        function handleChatEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // ============ HATUA 8f: Onesha error message ============
        function showError(message) {
            const movieResults = document.getElementById('movieResults');
            movieResults.innerHTML = '<div class="error-message">' + message + '</div>';
        }

        // ============ HATUA 8g: Jibu la kawaida wakati app inaanza ============
        window.addEventListener('load', function() {
            addMessageToChat('Habari! Karibu sana. Jina langu ni Movie Bot. Unaweza kutafuta filamu au kuuliza kitu chochote! 🎬', 'bot');
        });
    </script>
</body>
</html>
